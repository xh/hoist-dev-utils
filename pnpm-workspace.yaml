# pnpm settings (pnpm 11+ reads these from this file, not from a `pnpm` field in package.json).
# This is a single-package repo - the file exists for settings only, not to define a workspace.

# Dependency build scripts do not run unless reviewed here; unreviewed scripts are a hard error
# in CI. @parcel/watcher (via sass's watch-mode support, which this library never uses) has a
# native postinstall build - decline it rather than approve it, as prebuilt binaries ship as
# optional platform deps and nothing here needs the from-source fallback.
allowBuilds:
    '@parcel/watcher': false

# The default 24h maturity gate on new releases guards against a compromised upstream publish.
# Our own @xh packages are published by us and often consumed here the same day, so exempt the
# whole scope rather than pinning an exact version on every release.
minimumReleaseAgeExclude:
    - '@xh/*'
