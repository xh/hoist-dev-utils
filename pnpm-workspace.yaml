# pnpm settings (pnpm 11+ reads these from this file, not from a `pnpm` field in package.json).
# This is a single-package repo - the file exists for settings only, not to define a workspace.

# Dependency build scripts do not run unless reviewed here; unreviewed scripts are a hard error
# in CI. @parcel/watcher (via sass's watch-mode support, which this library never uses) has a
# native postinstall build - decline it rather than approve it, as prebuilt binaries ship as
# optional platform deps and nothing here needs the from-source fallback.
allowBuilds:
    '@parcel/watcher': false

# Caret vs. tilde policy for `dependencies`. These ranges are the contract consuming apps resolve
# against - this repo's lockfile is never published.
#
# Tilde by default: this is a toolchain aggregator, so apps take a dev-utils release rather than an
# Rsbuild release, and a caret would let minors change build output with no release behind them.
# Caret only where a dep must co-resolve with a copy the app or hoist-react also pulls in - tildes
# at different minors stop overlapping, and a duplicate copy is worse than an untested minor.
#
# `pnpm update` raises declared floors but preserves each operator, so tildes take patches and
# carets take minors. Moving a tilde dep's minor is deliberate, and earns a CHANGELOG entry.
savePrefix: '~'

# The default 24h maturity gate on new releases guards against a compromised upstream publish.
# Our own @xh packages are published by us and often consumed here the same day, so exempt the
# whole scope rather than pinning an exact version on every release.
minimumReleaseAgeExclude:
    - '@xh/*'

# Rspack 2.3.2 and 2.3.3 mangle wrongly with Hoist's minify options (see BLOCKED_RSPACK_VERSIONS in
# lib/common.js). Rsbuild's `~2.3.x` range would resolve 2.3.3, so pin Rspack here to run this
# repo's tests on a good release. Apps need the same pin in their own overrides. Remove both once a
# fixed Rspack ships and `test/minify.test.js` passes on it.
overrides:
    '@rspack/core': 2.3.1
