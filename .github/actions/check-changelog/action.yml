# Check Changelog - Reusable composite action that validates changelog fragments on a pull request.
#
# Runs `xh-changelog check` from this repository's checkout of hoist-dev-utils, with plain Node and
# no install, so it works in npm projects, Hoist apps and Gradle projects alike. It fails on a
# malformed fragment or on entries written straight into CHANGELOG.md, and warns when the pull
# request adds no fragment at all. It also writes the entries the pull request adds to the job
# summary, as the release will show them.
#
# In a release build, pass `release` instead. The action then fails unless CHANGELOG.md holds that
# version and no fragments are left, so a release cannot ship without its changelog.
#
# Prerequisites:
#   - The calling workflow must check out with `fetch-depth: 0`, so the PR's base commit is present.
#   - Node is on the PATH (it is on GitHub-hosted runners).

name: Check Changelog
description: Validates changelog fragments in changelog.d/ and warns when a pull request adds none.

inputs:
    base:
        description: 'Ref or SHA to diff against when looking for a new fragment. Defaults to the pull request base.'
        required: false
        default: ''
    require:
        description: 'Set to true to fail, not warn, when the pull request adds no fragment.'
        required: false
        default: 'false'
    skip-label:
        description: 'A pull request with this label is not expected to add a fragment.'
        required: false
        default: 'no-changelog'
    release:
        description: 'Version being published. Set this in a release build, to check that CHANGELOG.md holds the version and no fragments are left. The pull request checks are skipped.'
        required: false
        default: ''
    working-directory:
        description: 'Directory to run from. The check uses the nearest CHANGELOG.md at or above it.'
        required: false
        default: '.'

runs:
    using: composite
    steps:
        - name: Check changelog fragments
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          env:
              BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
              REQUIRE: ${{ inputs.require }}
              SKIP: ${{ contains(github.event.pull_request.labels.*.name, inputs.skip-label) }}
              RELEASE: ${{ inputs.release }}
          run: |
              cli="$GITHUB_ACTION_PATH/../../../bin/xh-changelog.js"
              if [[ -n "$RELEASE" ]]; then
                  node "$cli" check --release "$RELEASE"
                  exit
              fi
              args=(check)
              if [[ -n "$BASE" && "$SKIP" != "true" ]]; then args+=(--base "$BASE"); fi
              if [[ "$REQUIRE" == "true" ]]; then args+=(--require); fi
              if [[ -n "$BASE" && -n "$GITHUB_STEP_SUMMARY" ]]; then
                  {
                      echo "### Changelog entries in this pull request"
                      echo
                      GITHUB_ACTIONS=false node "$cli" preview --base "$BASE" 2>/dev/null \
                          | sed -e 's/^## /#### /' -e 's/^### /##### /' \
                          || echo "Could not build a preview."
                  } >> "$GITHUB_STEP_SUMMARY"
              fi
              node "$cli" "${args[@]}"
