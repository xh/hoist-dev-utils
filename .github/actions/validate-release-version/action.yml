# Validate Release Version — Reusable composite action for semver validation.
#
# Checks that a proposed release version is valid semver, has not already been tagged,
# and is a strict single increment from the latest relevant tag. Supports hotfix releases
# to older version lines.
#
# Prerequisites: The calling workflow must checkout with fetch-depth: 0 and fetch-tags: true
# so that all git tags are available locally.

name: Validate Release Version
description: Validates that a release version is valid semver and a strict increment from the latest tag.

inputs:
    version:
        description: 'The release version to validate (e.g. 12.0.0)'
        required: true
    is-hotfix:
        description: 'Set to true when releasing a hotfix to a version other than the latest.'
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Validate release version
          shell: bash
          env:
              VERSION: ${{ inputs.version }}
              IS_HOTFIX: ${{ inputs.is-hotfix }}
          run: bash "${{ github.action_path }}/validate-release-version.sh"
