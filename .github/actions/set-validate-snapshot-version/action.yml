# Set & Validate Snapshot Version — Reusable composite action that validates a SNAPSHOT version.
#
# Ensures the provided version contains the -SNAPSHOT suffix (appending it if missing),
# and optionally appends a timestamp for uniqueness (required for NPM, rejected by Maven Central).
# Does NOT modify any project files — callers are responsible for applying the resolved version.

name: Set & Validate Snapshot Version
description: Validates a SNAPSHOT version, optionally appending a timestamp for uniqueness.

inputs:
    version:
        description: 'The version to validate. The suffix "-SNAPSHOT" will be appended if not present.'
        required: true
    append-timestamp:
        description: 'Append a timestamp to the SNAPSHOT version for uniqueness. Required for NPM snapshots, must be false for Maven Central.'
        required: false
        default: 'true'

outputs:
    snapshot-version:
        description: 'The final validated SNAPSHOT version.'
        value: ${{ steps.validate.outputs.snapshot-version }}

runs:
    using: composite
    steps:
        - name: Validate SNAPSHOT version
          id: validate
          shell: bash
          env:
              VERSION: ${{ inputs.version }}
              APPEND_TIMESTAMP: ${{ inputs.append-timestamp }}
          run: |
              if [[ ! "$VERSION" == *-SNAPSHOT ]]; then
                VERSION="$VERSION-SNAPSHOT"
              fi
              if [[ "$APPEND_TIMESTAMP" == "true" ]]; then
                TIME=$(date +%s%3N)
                VERSION="$VERSION.$TIME"
              fi
              echo "Validated snapshot version: $VERSION"
              echo "snapshot-version=$VERSION" >> "$GITHUB_OUTPUT"