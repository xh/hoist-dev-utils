# Build Snapshot Tag — Reusable composite action that emits the two build identifiers
# for a snapshot Docker build, derived from a SINGLE snapped timestamp so they correspond.
#
# Outputs:
#   app-build — readable value baked into appBuild on client + server and shown in-app
#               (<ref>_<sha>_<timestamp>, colon preserved). Client and server must carry
#               the same value; that is what Hoist's version-skew check compares.
#   image-tag — immutable ECR image tag (snap_<ref>_<sha>_<ts>). A total function: a valid
#               Docker/ECR image tag for any git ref. Container-tag constraints live here
#               only — they never touch the displayed app-build value.
#
# Snap the timestamp once and read both outputs in the calling `prepare` job, then pass
# app-build to the build (xhAppBuild / --env appBuild) and image-tag to the image push +
# promote. Delegates to .github/scripts/build-tag.sh (unit-tested by build-tag.test.sh).

name: Build Snapshot Tag
description: Emits app-build and image-tag identifiers for a snapshot Docker build.

outputs:
    app-build:
        description: 'Readable build identifier baked into appBuild (client + server).'
        value: ${{ steps.tag.outputs.app-build }}
    image-tag:
        description: 'Immutable, sanitized, snap_-prefixed ECR image tag.'
        value: ${{ steps.tag.outputs.image-tag }}

runs:
    using: composite
    steps:
        - name: Generate build identifiers
          id: tag
          shell: bash
          run: |
              ts=$(date -u +'%Y-%m-%dT%H:%MZ')
              script="$GITHUB_ACTION_PATH/../../scripts/build-tag.sh"
              {
                  echo "app-build=$(BUILD_TS="$ts" bash "$script" app)"
                  echo "image-tag=$(BUILD_TS="$ts" bash "$script" image)"
              } >> "$GITHUB_OUTPUT"
