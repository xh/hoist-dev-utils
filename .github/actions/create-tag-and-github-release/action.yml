# Create Tag & GitHub Release — Reusable composite action for tagging and creating github "release" artifacts.
#
# Tags the current commit, pushes the tag, and creates a GitHub release with auto-generated
# notes. For hotfix releases, scopes the notes to the relevant previous release and marks
# the release as non-latest.
#
# Prerequisites: The calling workflow must checkout with fetch-depth: 0 and fetch-tags: true
# so that all git tags are available locally.

name: Create Tag & GitHub Release
description: Tags the commit, pushes the tag, and creates a GitHub release with auto-generated notes.

inputs:
    version:
        description: 'The release version (e.g. 12.0.0).'
        required: true
    is-hotfix:
        description: 'Set to true for hotfix releases. Scopes notes to the major version line and marks as non-latest.'
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Tag release
          shell: bash
          env:
              VERSION: ${{ inputs.version }}
          run: |
              git tag "v$VERSION"
              git push origin "v$VERSION"

        - name: Create GitHub release
          shell: bash
          env:
              VERSION: ${{ inputs.version }}
              IS_HOTFIX: ${{ inputs.is-hotfix }}
          run: |
              LATEST_FLAG="--latest"
              NOTES_FLAG="--generate-notes"
              # For hotfixes, mark as non-latest and scope release notes to only
              # include changes since the previous tag in the same major version line.
              if [ "$IS_HOTFIX" = "true" ]; then
                  LATEST_FLAG="--latest=false"
                  MAJOR=$(echo "$VERSION" | cut -d. -f1)
                  PREV_TAG=$(git tag -l "v${MAJOR}.*" \
                      | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" \
                      | sed 's/^v//' \
                      | sort -t. -k1,1n -k2,2n -k3,3n \
                      | grep -v "^${VERSION}$" \
                      | tail -1) || true
                  if [ -n "$PREV_TAG" ]; then
                      NOTES_FLAG="--generate-notes --notes-start-tag v$PREV_TAG"
                  fi
              fi
              gh release create "v$VERSION" \
                  --title "v$VERSION" \
                  $NOTES_FLAG \
                  "$LATEST_FLAG"
