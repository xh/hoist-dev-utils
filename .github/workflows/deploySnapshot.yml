# Deploy Snapshot — Publishes a SNAPSHOT build to npm on every push to develop.
#
# Snapshots are mutable development builds (version from package.json, e.g. 8.0.0-SNAPSHOT).
# They are published with the `next` dist-tag so they don't affect `latest`. For numbered
# releases, see Deploy Release.

name: Deploy Snapshot

on:
    push:
        branches: [ "develop" ]
    workflow_dispatch:
        inputs:
            version:
                description: '(Optional) Snapshot version to override default in package.json. Note that the suffix "-SNAPSHOT" will be automatically appended if not present.'
                required: false
                default: ''
                type: string

# Debounce builds by branch. Newer runs from a branch will cancel the current run and start over.
concurrency:
    group: deploy-snapshot-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:

        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Allows the job to mint a short-lived OIDC token, which npm exchanges for a scoped
            # publish token (npm "trusted publishing"). Grants nothing on npm by itself - the
            # registry only honors it if a trusted publisher is configured for the package naming
            # this repo and workflow file. Also what lets npm attach a provenance attestation to
            # the published tarball.
            id-token: write

        steps:
        - uses: actions/checkout@v6

        # Installs the pnpm version pinned via the packageManager field in package.json.
        - name: Setup pnpm
          uses: pnpm/setup@v2
          with:
              # `install: false` - this workflow runs its own install step below, so it
              # resolves with --frozen-lockfile rather than a plain install.
              install: false

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version-file: '.nvmrc'
              registry-url: 'https://registry.npmjs.org'
              # No dependency cache in a job that can publish, per npm's trusted publishing
              # guidance - a poisoned cache would otherwise run with publish rights.
              package-manager-cache: false

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Prepare snapshot version
          id: snapshot
          uses: ./.github/actions/prepare-npm-snapshot-version
          with:
              version: ${{ inputs.version }}

        # Auth is OIDC trusted publishing only (npm >= 11.5.1), with no token fallback - a trusted
        # publisher config that does not match this repo and workflow fails the publish rather
        # than npm silently publishing with a long-lived token. npm attaches provenance itself
        # under trusted publishing, so there is no `--provenance` flag.
        - name: Publish snapshot to npm
          run: npm publish --tag next
