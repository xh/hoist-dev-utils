# Deploy Snapshot — Publishes a SNAPSHOT build to npm on every push to develop.
#
# Snapshots are mutable development builds (version from package.json, e.g. 8.0.0-SNAPSHOT).
# They are published with the `next` dist-tag so they don't affect `latest`. For numbered
# releases, see Deploy Release.

name: Deploy Snapshot

on:
    push:
        branches: [ "develop" ]
    workflow_dispatch:
        inputs:
            version:
                description: '(Optional) Snapshot version to override default in package.json. Note that the suffix "-SNAPSHOT" will be automatically appended if not present.'
                required: false
                default: ''
                type: string

concurrency:
    group: deploy-snapshot
    cancel-in-progress: true

jobs:
    build:

        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
        - uses: actions/checkout@v6

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version-file: '.nvmrc'
              registry-url: 'https://registry.npmjs.org'
              cache: 'yarn'

        - name: Install dependencies
          run: yarn install --frozen-lockfile

        - name: Read current version from package.json
          if: inputs.version == ''
          id: current-version
          run: echo "current-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

        - name: Resolve snapshot version
          id: snapshot
          uses: ./.github/actions/set-validate-snapshot-version
          with:
              version: ${{ inputs.version || steps.current-version.outputs.current-version }}

        - name: Set snapshot version in package.json
          env:
              VERSION: ${{ steps.snapshot.outputs.snapshot-version }}
          run: npm version --no-git-tag-version --new-version "$VERSION"

        - name: Publish snapshot to npm
          env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          run: npm publish --tag next
